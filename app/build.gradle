buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.application'

// Release signing reads keystore.properties (never committed). Without it, assembleRelease
// produces an unsigned APK that can be signed later with apksigner.
def keystoreFile = file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'io.github.npfp222.hzunlock'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.npfp222.hzunlock'
        minSdk 34
        targetSdk 36
        versionCode 13
        versionName '1.0.2'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The display service deliberately calls hidden SurfaceControl and DeX APIs through reflection.
        disable 'PrivateApi', 'DiscouragedPrivateApi', 'SetTextI18n'
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
